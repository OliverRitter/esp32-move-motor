; PlatformIO Project Configuration File for ESP32-S3 N16R8 Tracking Rig
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 🚀 STORAGE STRATEGY OVERRIDES FOR N16R8 OCTAL HARDWARE
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM

; 📦 REQUIRED DRIVER LIBRARY DEPENDENCIES
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    madhephaestus/ESP32Servo @ ^1.2.1
